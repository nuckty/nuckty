name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.filter.outputs.native }}
      demo: ${{ steps.filter.outputs.demo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          filters: |
            native:
              - 'packages/**'
              - 'package-lock.json'
            demo:
              - 'demo/**'
              - 'packages/**'
              - 'package-lock.json'
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --package-lock-only --audit-level=low --registry=https://registry.npmjs.org
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: node docs/scripts/check-source-links.mjs
      - run: node docs/scripts/check-pages.mjs
      - run: node --test scripts/*.test.mjs
      - run: cmp logo/nuckty-logo-black-transparent.svg demo/blocks/brand/brand.svg && node scripts/check-imports.mjs
  native:
    needs: paths
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.paths.outputs.native == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.paths.outputs.native == 'true'
        with:
          node-version: 24
      - if: needs.paths.outputs.native == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y nginx apache2 default-jre-headless
          npm ci
          npm run build
          NUCKTY_HOSTING_HTTP=1 NUCKTY_SERVE_NATIVE=1 NUCKTY_VNU_NATIVE=1 npm run test:coverage
  demo:
    needs: paths
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.paths.outputs.demo == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.paths.outputs.demo == 'true'
        with:
          node-version: 24
      - if: needs.paths.outputs.demo == 'true'
        run: |
          java -version
          npm ci
          npm run build
          npm run lint -w @nuckty/demo
          npm test -w @nuckty/demo
          npm run validate -w @nuckty/demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.paths.outputs.demo == 'true'
        with:
          name: demo-${{ github.sha }}
          path: |
            demo/site
            demo/site-en
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
