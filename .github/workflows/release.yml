name: Release
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      promote-latest:
        description: Move the latest dist-tag of every package to this already published version; leave empty to publish
        required: false
        type: string
        default: ''
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  release:
    if: (github.event_name == 'workflow_dispatch' && inputs.promote-latest == '') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.pending.outputs.published }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: pending
        name: Find versions missing from the registry
        run: |
          pending="$(node scripts/unpublished-packages.mjs)"
          printf '%s\n' "$pending"
          if [ -n "$pending" ]; then echo 'published=true' >> "$GITHUB_OUTPUT"; fi
      - if: steps.pending.outputs.published == 'true'
        run: npm install --global npm@11.21.1
      - name: Keep npm configuration free of token credentials
        if: steps.pending.outputs.published == 'true'
        run: printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
      - id: channel
        run: |
          echo "channel=$(node -e 'const fs=require("fs");console.log(fs.existsSync(".changeset/pre.json") ? JSON.parse(fs.readFileSync(".changeset/pre.json")).tag : "latest")')" >> "$GITHUB_OUTPUT"
      - name: Publish and tag the release
        if: steps.pending.outputs.published == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm ci
          npm run release
          git push origin --tags
  verify-registry:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: java -version && npm ci && node demo/scripts/package-smoke.mjs
  deploy-demo:
    needs: verify-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci && npm run build
      - name: Deploy verified static artifact
        env:
          DEPLOY_KEY: ${{ secrets.NUCKTY_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.NUCKTY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.NUCKTY_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ vars.NUCKTY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$KNOWN_HOSTS"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$stage/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$stage/known_hosts"
          cp -a demo/site "$stage/ru"
          cp -a demo/site-en "$stage/en"
          tar -C "$stage" -czf - ru en | ssh -i "$stage/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$stage/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $RELEASE_SHA $GITHUB_RUN_ID"
  update-site:
    needs: [release, deploy-demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NUCKTY_REBUILD_APP_ID }}
          private-key: ${{ secrets.NUCKTY_REBUILD_APP_PRIVATE_KEY }}
          owner: nuckty
          repositories: nuckty-site
          permission-actions: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: gh api --method POST repos/nuckty/nuckty-site/actions/workflows/update-packages.yml/dispatches -f ref=main -f "inputs[channel]=$CHANNEL"
  promote-latest:
    if: github.event_name == 'workflow_dispatch' && inputs.promote-latest != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.1
      - name: Keep npm configuration free of token credentials
        run: printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
      - name: Promote the published version to latest
        env:
          PROMOTE_VERSION: ${{ inputs.promote-latest }}
        run: node scripts/promote-latest.mjs
