name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.21.1
      - name: Keep npm configuration free of token credentials
        run: printf 'registry=https://registry.npmjs.org/\n' > "$NPM_CONFIG_USERCONFIG"
      - run: npm ci
      - id: channel
        run: |
          echo "channel=$(node -e 'const fs=require("fs");console.log(fs.existsSync(".changeset/pre.json") ? JSON.parse(fs.readFileSync(".changeset/pre.json")).tag : "latest")')" >> "$GITHUB_OUTPUT"
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          publish: npm run release
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  verify-registry:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: java -version && npm ci && node demo/scripts/package-smoke.mjs
  deploy-demo:
    needs: verify-registry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    environment: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci && npm run build
      - name: Deploy verified static artifact
        env:
          DEPLOY_KEY: ${{ secrets.NUCKTY_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.NUCKTY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.NUCKTY_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ vars.NUCKTY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$KNOWN_HOSTS"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$stage/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$stage/known_hosts"
          cp -a demo/site "$stage/ru"
          cp -a demo/site-en "$stage/en"
          tar -C "$stage" -czf - ru en | ssh -i "$stage/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$stage/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_ID"
  update-site:
    needs: [release, deploy-demo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NUCKTY_REBUILD_APP_ID }}
          private-key: ${{ secrets.NUCKTY_REBUILD_APP_PRIVATE_KEY }}
          owner: nuckty
          repositories: nuckty-site
          permission-actions: write
      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CHANNEL: ${{ needs.release.outputs.channel }}
        run: gh api --method POST repos/nuckty/nuckty-site/actions/workflows/update-packages.yml/dispatches -f ref=main -f "inputs[channel]=$CHANNEL"
