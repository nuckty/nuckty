name: Rebuild documentation site
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: rebuild-documentation-site
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - id: changes
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD^ HEAD | grep -q '^docs/'; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - id: app
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.NUCKTY_REBUILD_APP_ID }}
          private-key: ${{ secrets.NUCKTY_REBUILD_APP_PRIVATE_KEY }}
          owner: nuckty
          repositories: nuckty-site
          permission-actions: write
      - if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api --method POST repos/nuckty/nuckty-site/actions/workflows/ci.yml/dispatches -f ref=main
