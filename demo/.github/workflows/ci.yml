name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: nuckty-demo
      - name: Resolve latest successfully verified engine and documentation
        run: node nuckty-demo/.github/resolve-sources.mjs
      - name: Validate exact source set and pinned commit SHAs
        id: refs
        env:
          NUCKTY_SOURCES: ${{ vars.NUCKTY_SOURCES }}
        run: |
          node --input-type=module <<'NODE'
          const names = ["nuckty", "nuckty-ext-block-gallery", "nuckty-ext-block-grid", "nuckty-ext-block-root", "nuckty-ext-command-content-external", "nuckty-ext-command-convert-images", "nuckty-ext-command-deploy-ftp", "nuckty-ext-command-serve", "nuckty-ext-command-validate-vnu", "nuckty-ext-markdown-typography-ru", "nuckty-ext-markdown-video"];
          let sources;
          try {
              sources = JSON.parse(process.env.NUCKTY_SOURCES ?? '');
          } catch {
              throw new Error('NUCKTY_SOURCES must be a JSON object mapping every package to {repository, ref}.');
          }
          if (!sources || typeof sources !== 'object' || Array.isArray(sources) || Object.keys(sources).sort().join() !== [...names].sort().join()) {
              throw new Error('NUCKTY_SOURCES must contain exactly these 11 package names: ' + names.join(', '));
          }
          sources.nuckty.ref = process.env.NUCKTY_ENGINE_REF;
          for (const name of names) {
              const source = sources[name];
              if (!source || !/^[a-zA-Z0-9][\w.-]*\/[a-zA-Z0-9][\w.-]*$/.test(source.repository ?? '') || !/^[a-f0-9]{40}$/.test(source.ref ?? '')) {
                  throw new Error(`Invalid pinned repository/ref for ${name}; each ref must be a lowercase 40-character commit SHA.`);
              }
              const key = name.replaceAll('-', '_');
              await import('node:fs/promises').then(({ appendFile }) => appendFile(process.env.GITHUB_OUTPUT, `${key}_repository=${source.repository}\n${key}_ref=${source.ref}\n`));
          }
          NODE
      - name: Checkout nuckty at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ref }}
          path: nuckty
      - name: Checkout nuckty-ext-block-gallery at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_block_gallery_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_block_gallery_ref }}
          path: nuckty-ext-block-gallery
      - name: Checkout nuckty-ext-block-grid at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_block_grid_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_block_grid_ref }}
          path: nuckty-ext-block-grid
      - name: Checkout nuckty-ext-block-root at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_block_root_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_block_root_ref }}
          path: nuckty-ext-block-root
      - name: Checkout nuckty-ext-command-content-external at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_command_content_external_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_command_content_external_ref }}
          path: nuckty-ext-command-content-external
      - name: Checkout nuckty-ext-command-convert-images at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_command_convert_images_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_command_convert_images_ref }}
          path: nuckty-ext-command-convert-images
      - name: Checkout nuckty-ext-command-deploy-ftp at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_command_deploy_ftp_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_command_deploy_ftp_ref }}
          path: nuckty-ext-command-deploy-ftp
      - name: Checkout nuckty-ext-command-serve at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_command_serve_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_command_serve_ref }}
          path: nuckty-ext-command-serve
      - name: Checkout nuckty-ext-command-validate-vnu at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_command_validate_vnu_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_command_validate_vnu_ref }}
          path: nuckty-ext-command-validate-vnu
      - name: Checkout nuckty-ext-markdown-typography-ru at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_markdown_typography_ru_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_markdown_typography_ru_ref }}
          path: nuckty-ext-markdown-typography-ru
      - name: Checkout nuckty-ext-markdown-video at its pinned source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ steps.refs.outputs.nuckty_ext_markdown_video_repository }}
          ref: ${{ steps.refs.outputs.nuckty_ext_markdown_video_ref }}
          path: nuckty-ext-markdown-video
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            nuckty/package-lock.json
            nuckty-ext-*/package-lock.json
            nuckty-demo/package-lock.json
      - name: Require system Java before installing validator dependencies
        run: java -version
      - name: Install and build all package sources
        run: |
          for package in nuckty nuckty-ext-*; do
            npm_config_cache="$(npm config get cache)" npm ci --no-audit --no-fund --registry=https://registry.npmjs.org --prefix "$package"
            npm audit --package-lock-only --audit-level=low --registry=https://registry.npmjs.org --prefix "$package"
            npm_config_cache="$(npm config get cache)" npm run build --prefix "$package"
          done
      - name: Verify both language artifacts
        working-directory: nuckty-demo
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org
          npm run lint
          npm run build
          npm test
          npm run validate
      - name: Audit demo lockfile
        working-directory: nuckty-demo
        run: npm audit --package-lock-only --audit-level=low --registry=https://registry.npmjs.org
      - name: Verify smoke snapshot boundaries
        working-directory: nuckty-demo
        run: npm run test:copy-filter
      - name: Verify clean demo install and build
        working-directory: nuckty-demo
        run: npm_config_cache="$(npm config get cache)" npm run test:clean-install
      - name: Prepare registry metadata and tarballs for offline smoke
        working-directory: nuckty-demo
        run: npm_config_cache="$(npm config get cache)" node scripts/prepare-package-cache.mjs
      - name: Verify all published package boundaries
        working-directory: nuckty-demo
        run: npm_config_cache="$(npm config get cache)" npm run test:package
      - name: Save RU static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuckty-demo-ru-${{ github.sha }}
          path: nuckty-demo/site/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Save EN static site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuckty-demo-en-${{ github.sha }}
          path: nuckty-demo/site-en/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Deploy verified static artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.NUCKTY_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.NUCKTY_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.NUCKTY_DEPLOY_USER }}
          KNOWN_HOSTS: ${{ vars.NUCKTY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_USER" && test -n "$KNOWN_HOSTS"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$stage/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$stage/known_hosts"
          cp -a nuckty-demo/site "$stage/ru"
          cp -a nuckty-demo/site-en "$stage/en"
          tar -C "$stage" -czf - ru en | ssh -i "$stage/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$stage/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $GITHUB_RUN_ID"
